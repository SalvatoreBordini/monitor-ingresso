<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Ingresso Scuola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Intestazione con Logo, Nome Scuola e Orario -->
        <header class="header">
            <div class="logo-scuola">
                <h2>ISTITUTO SCOLASTICO</h2>
            </div>
            <div class="datetime">
                <span id="current-date">--/--/----</span>
                <span id="current-time">00:00</span>
            </div>
        </header>

        <!-- Contenuto Principale: Diviso in due colonne -->
        <main class="main-content">
            <!-- Colonna Sinistra: Avvisi Principali -->
            <section class="notice-board">
                <h2>📢 AVVISI IMPORTANTI</h2>
                <div id="notices-container">
                    <p>Caricamento avvisi...</p>
                </div>
            </section>

            <!-- Colonna Destra: News ed Eventi -->
            <section class="news-board">
                <h2>📅 EVENTI E CIRCOLARI</h2>
                <div id="news-container">
                    <p>Caricamento eventi...</p>
                </div>
            </section>
        </main>

        <!-- Barra Scorrevole in basso per comunicazioni flash -->
        <footer class="ticker-wrap">
            <div class="ticker" id="ticker-text">
                Benvenuti a scuola! Si ricorda di rispettare gli orari di ingresso.
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
